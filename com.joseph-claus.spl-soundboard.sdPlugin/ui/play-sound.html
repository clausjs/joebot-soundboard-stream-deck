<html>
    <head lang="en">
        <title>Select Sound</title>
        <meta charset="utf-8" />
        <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    </head>
  <body>
    <sdpi-item label="Sound">
        <sdpi-select 
            id='sound-dropdown' 
            setting="sound" 
            placeholder="Select sound..."
            loading="Loading sounds..."
            datasource="getClips"
            hot-reload
        >
        </sdpi-select>
        <sdpi-button hidden="true" id="auth_button" label="authenticate" onclick="authenticate()">Authenticate</sdpi-button>
    </sdpi-item>
    <script>
        // (async function() {

        // })();
        const { streamDeckClient } = SDPIComponents;
        
        function showAuthentication() {
            const dropdown = document.getElementById("sound-dropdown");
            const authButton = document.getElementById("auth_button");
            dropdown.hidden = true;
            authButton.hidden = false;
        }

        function hideAuthentication() {
            const dropdown = document.getElementById("sound-dropdown");
            const authButton = document.getElementById("auth_button");
            dropdown.hidden = false;
            authButton.hidden = true;
        }

        streamDeckClient.getGlobalSettings().then(settings => {
            if (!settings.token) {
                showAuthentication();
            }
        });

        streamDeckClient.sendToPropertyInspector.subscribe(async (ev) => {
            if (ev.payload.event === "token-retrieved") {
                const settings = await streamDeckClient.getGlobalSettings();
                await streamDeckClient.setGlobalSettings({
                    ...settings,
                    token: ev.payload.token
                });
                hideAuthentication();
            }
        });
        
        function authenticate() {
            streamDeckClient.getGlobalSettings().then(settings => {
                const { webUrlBase } = settings;
                streamDeckClient.send('openUrl', { url: `${webUrlBase}/streamdeck-setup` });
            });
        }
    </script>
  </body>
</html>
